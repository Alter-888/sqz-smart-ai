# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${PROFILE_DIR:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
    org.springframework.ai: debug
    org.springframework.web.client.RestClient: debug

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid,dev
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain,com.ruoyi.**.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）- /ai/chat/send 恢复 XSS 过滤，防止输入-回显链路被利用
  excludes: /ai/knowledge/upload
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/business/*,/ai/*

# Spring AI 配置 — 阿里云百炼 DashScope（Qwen 官方平台，原生支持 Function Calling）
# 获取 API Key: https://dashscope.console.aliyun.com/ → 创建 API Key
spring.ai:
  openai:
    api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    chat:
      options:
        # model: qwen3.5-plus
        model: qwen3.7-flash
        temperature: 0.7
        max-tokens: 2048
    embedding:
      options:
        model: text-embedding-v3
  # MCP Server 配置：将 AI 工具暴露为标准 MCP 协议端点
  mcp:
    server:
      name: smart-cs-mcp-server
      version: 1.0.0

# 智能客服配置
smart-cs:
  upload:
    # 上传根目录（环境变量优先，兜底 D:/ruoyi/uploadPath）
    path: ${UPLOAD_DIR:${PROFILE_DIR:D:/ruoyi/uploadPath}}/ai-knowledge/
  vector-store:
    # PG + pgvector 向量库（01 §三；勿用 starter，见 01 §二）
    pg:
      url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:ai_vector}
      username: ${PG_USER:vector}
      password: ${PG_PWD}            # 必须由环境变量提供，不写进仓库
      schema-name: public
      table-name: vector_store
      dimensions: 1024               # 必须等于 text-embedding-v3 的输出维度
      initialize-schema: true        # 首次启动自动建表 + 建 HNSW 索引
      max-document-batch-size: 200
      pool-size: 5                   # 向量库并发很低，5 足够
  agent:
    tool-budget-per-turn: 8          # 单轮工具调用上限，超出即停
    supervisor-enabled: true         # 关掉后跨域退化为按首个命中域直连
    supervisor-max-delegations: 3    # Supervisor 单轮最多委派几个 Worker
    eval-sample-rate: 0.1            # 异步抽检采样率
    hitl-enabled: true               # 高危操作先出待确认单
    hitl-tools: cancelOrder,payOrder,checkoutFromCart,clearCart
  model:
    worker: ${AI_WORKER_MODEL:qwen3.7-flash}
    router: ${AI_ROUTER_MODEL:qwen3.7-flash}
    judge:  ${AI_JUDGE_MODEL:qwen3.7-flash}
  rag:
    similarity-threshold: 0.4
    vector-top-k: 20
    full-text-enabled: false         # P5 打开
    full-text-top-k: 20
    rrf-k: 60
    fusion-top-k: 8
    final-top-k: 4
    chunk-size: 400
    parent-expand: false
    rerank:
      enabled: false
  eval:
    dataset: v1
    k: 8                  # 评测口径，定死不动
    run-agent: false      # 是否真的跑 Worker
    judge-enabled: false  # 是否让 judge 打忠实度分
    user-id: -1           # 评测专用 userId，在线指标一律排除
    legacy-retrieval: false
  chat:
    max-memory-messages: 30
    retry-max-attempts: 3
